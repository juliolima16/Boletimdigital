<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <!-- Faz o site funcionar bem em celular -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Boletim Digital</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- CABEÇALHO -->
  <header class="cabecalho">
    <h1>Boletim Digital</h1>
    <p class="subtitulo">9º Ano</p>
  </header>

  <main class="conteudo">

    <!-- CARDS DE RESUMO (serão preenchidos pelo JavaScript) -->
    <section class="cards" id="cards">
      <!-- Cada card tem um título e um valor que o JS vai preencher -->
      <div class="card">
        <h2>Média Geral</h2>
        <p class="valor" id="media-geral">—</p>
      </div>

      <div class="card">
        <h2>Total de Faltas</h2>
        <p class="valor" id="total-faltas">—</p>
      </div>

      <div class="card">
        <h2>Bom Desempenho</h2>
        <p class="valor" id="total-bom">—</p>
      </div>

      <div class="card">
        <h2>Precisam de Atenção</h2>
        <p class="valor" id="total-atencao">—</p>
      </div>

      <div class="card">
        <h2>Frequência</h2>
        <p class="valor" id="frequencia">—</p>
        <p class="detalhe">Frequência adequada</p>
      </div>
    </section>

    <!-- TABELA DE DISCIPLINAS (será preenchida pelo JavaScript) -->
    <section class="tabela-area">
      <h2>Notas por Disciplina</h2>

      <div class="tabela-responsiva">
        <table>
          <thead>
            <tr>
              <th>Disciplina</th>
              <th>1º Tri</th>
              <th>2º Tri</th>
              <th>3º Tri</th>
              <th>Média</th>
              <th>Faltas</th>
              <th>Situação</th>
            </tr>
          </thead>
          <!-- O corpo da tabela é preenchido pelo script.js -->
          <tbody id="corpo-tabela"></tbody>
        </table>
      </div>
    </section>

  </main>

  <!-- RODAPÉ -->
  <footer class="rodape">
    <p>Projeto escolar — dados fictícios para demonstração.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
